name: guia

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # exposta para dev (psql/pgAdmin local); 5433 no host pois 5432 já está em uso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - guia-net

  api:
    build:
      context: ../backend
      dockerfile: ../docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000" # 3001 no host pois 3000 já está em uso
    healthcheck:
      # /health fica fora do prefixo /api/v1 e valida a conexão com o banco.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - guia-net

  web:
    build:
      context: ../frontend
      dockerfile: ../docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80" # acesso local direto p/ debug; o Traefik NÃO precisa disso
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - guia-net
    labels:
      - "traefik.enable=true"
      # Traefik (host mode) alcança o container pelo IP desta rede, na porta 80.
      # O nginx deste container também faz proxy de /api/ para o serviço `api`,
      # então um único router cobre SPA + API.
      - "traefik.docker.network=guia_net"
      # ATENÇÃO: ${APP_DOMAIN} é interpolado pelo compose a partir do .env da RAIZ
      # do projeto — no VPS, suba com:
      #   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
      # (sem --env-file, cai no default "localhost" e o router não casa o domínio)
      - "traefik.http.routers.guia.rule=Host(`${APP_DOMAIN:-localhost}`)"
      # Se o domínio tiver DNS para www, troque a rule por:
      # - "traefik.http.routers.guia.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.guia.entrypoints=websecure"
      - "traefik.http.routers.guia.tls=true"
      - "traefik.http.routers.guia.tls.certresolver=letsencrypt"
      - "traefik.http.services.guia.loadbalancer.server.port=80"
      # HTTP->HTTPS já é redirecionado globalmente pelo Traefik.

volumes:
  db_data:

networks:
  guia-net:
    driver: bridge
    # Nome fixo p/ casar com traefik.docker.network (sem prefixo do projeto).
    name: guia_net
