name: guia

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # exposta para dev (psql/pgAdmin local); 5433 no host pois 5432 já está em uso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - guia-net

  api:
    build:
      context: ../backend
      dockerfile: ../docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000" # 3001 no host pois 3000 já está em uso
    healthcheck:
      # /health fica fora do prefixo /api/v1 e valida a conexão com o banco.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - guia-net

  web:
    build:
      context: ../frontend
      dockerfile: ../docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80" # 8081 no host pois 8080 já está em uso
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - guia-net

volumes:
  db_data:

networks:
  guia-net:
    driver: bridge
